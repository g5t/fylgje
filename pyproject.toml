[build-system]
# conanfile.py supplies the dependencies, built from source where ConanCenter
# has no matching binary
requires = ["scikit-build-core>=0.10", "scikit-build-core-conan>=0.9"]
build-backend = "scikit_build_core_conan.build"

[project]
name = "fylgje"
dynamic = ["version"]
description = "Capture and histogram ESS ar51 raw detector readout from Kafka, headless"
readme = "README.md"
license = { text = "BSD-2-Clause" }
authors = [{ name = "Gregory Tucker", email = "gregory.tucker@ess.eu" }]
requires-python = ">=3.10"

[tool.scikit-build]
minimum-version = "0.10"
# no Python extension: one wheel per platform, any CPython 3
wheel.py-api = "py3"
wheel.packages = []

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/Version.h"
regex = 'version = "v(?P<value>[^"]+)"'

[tool.scikit-build-core-conan]
# cyrus-sasl 2.1.28 has K&R-style prototypes that C23 (GCC 15's default) rejects
config = ["cyrus-sasl/*:tools.build:cflags=['-std=gnu17']"]

[tool.cibuildwheel]
archs = ["auto64"]
# py3-none wheels: build against a single CPython per platform
build = ["cp312-*"]
skip = ["*-musllinux*"]
build-verbosity = 1
test-command = "fylgje-cli --version && fylgje-cli --help"

[tool.cibuildwheel.linux]
# Conan builds OpenSSL from source; its Configure needs core Perl modules (IPC::Cmd, ...) absent from manylinux_2_28
before-all = "dnf install -y perl"
